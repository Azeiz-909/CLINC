<style>
  :root{
    --bg:#F6F2EA;
    --surface:#FFFFFF;
    --primary:#2E5F5C;
    --primary-dark:#1F433F;
    --primary-light:#7FA9A2;
    --accent:#E3A15E;
    --accent-soft:#F3D9B8;
    --text:#2A2A28;
    --text-muted:#7A7772;
    --line:#E7E0D3;
    --danger:#C4604D;
    --radius-lg:28px;
    --radius-md:18px;
    --radius-sm:12px;
    --shadow:0 12px 30px -14px rgba(31,67,63,0.25);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;}
  html,body{
    font-family:'Tajawal',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }
  button,a{touch-action:manipulation;}
  h1,h2,h3,.brand,.cat-name,.field-label-display{font-family:'Cairo',sans-serif;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  button svg, a svg{width:16px;height:16px;flex-shrink:0;}
  input,textarea{font-family:inherit;}

  /* decorative blob background */
  .blob-bg{
    position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  }
  .blob-bg svg{position:absolute;}
  .blob-1{top:-120px;right:-160px;width:520px;opacity:0.5;}
  .blob-2{bottom:-160px;left:-140px;width:460px;opacity:0.35;}

  .app{position:relative;z-index:1;min-height:100vh;}

  /* ---------- LOGIN ---------- */
  .login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .login-card{
    background:var(--surface);
    width:100%;max-width:400px;
    padding:44px 36px;
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    text-align:center;
  }
  .login-mark{
    width:64px;height:64px;border-radius:20px;
    background:linear-gradient(145deg,var(--primary),var(--primary-dark));
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;
    box-shadow:0 8px 18px -6px rgba(46,95,92,0.55);
  }
  .login-mark svg{width:30px;height:30px;}
  .login-card h1{font-size:22px;color:var(--primary-dark);margin:0 0 4px;}
  .login-card p.sub{color:var(--text-muted);font-size:14px;margin:0 0 28px;}
  .field{text-align:right;margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:6px;font-weight:500;}
  .field input{
    width:100%;padding:13px 16px;border-radius:var(--radius-sm);
    border:1.5px solid var(--line);background:#FBFAF7;
    font-size:15px;color:var(--text);outline:none;transition:.2s;
  }
  .field input:focus{border-color:var(--primary-light);background:#fff;}
  .field-row-2{display:flex;gap:12px;}
  .field-row-2 .field{flex:1;margin-bottom:16px;}
  .field-row-2 .field-emoji{flex:0 0 84px;}
  .field-row-2 .field-emoji input{text-align:center;font-size:19px;padding:11px 8px;}
  .btn-primary{
    width:100%;padding:14px;border-radius:var(--radius-sm);
    background:var(--primary);color:#fff;font-weight:700;font-size:15px;
    margin-top:8px;transition:.2s;
  }
  .btn-primary:hover{background:var(--primary-dark);}
  .login-note{margin-top:18px;font-size:12px;color:var(--text-muted);line-height:1.8;}

  /* ---------- TOPBAR ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(18px + env(safe-area-inset-top)) 28px 18px;max-width:1100px;margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:10px;font-size:19px;color:var(--primary-dark);font-weight:800;}
  .brand .dot{width:10px;height:10px;background:var(--accent);border-radius:50%;}
  .top-actions{display:flex;align-items:center;gap:10px;}
  .icon-btn{
    width:42px;height:42px;border-radius:14px;background:var(--surface);
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
    color:var(--primary-dark);transition:.15s;
  }
  .icon-btn:hover{background:var(--accent-soft);}
  .icon-btn svg{width:19px;height:19px;}

  .container{max-width:1100px;margin:0 auto;padding:0 28px 60px;}

  .page-head{margin:10px 0 26px;}
  .page-head h2{font-size:24px;margin:0 0 4px;color:var(--primary-dark);}
  .page-head p{color:var(--text-muted);font-size:14px;margin:0;}
  .back-link{
    display:inline-flex;align-items:center;gap:6px;color:var(--primary);
    font-weight:700;font-size:14px;margin-bottom:14px;
  }
  .back-link svg{width:16px;height:16px;}

  /* main page-level navigation back button: bold pill button, stays visible while scrolling
     so the doctor can leave a long patient page without scrolling back to the top */
  .page-back{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--surface);color:var(--primary-dark);
    font-weight:700;font-size:14.5px;
    padding:11px 18px;border-radius:999px;
    border:1.5px solid var(--line);box-shadow:var(--shadow);
    margin-bottom:16px;
    position:sticky;top:calc(12px + env(safe-area-inset-top));z-index:30;    transition:.15s;
  }
  .page-back:hover{border-color:var(--primary-light);background:var(--accent-soft);}
  .page-back:active{transform:scale(0.97);}
  .page-back svg{width:18px;height:18px;flex-shrink:0;}

  /* ---------- CATEGORY GRID ---------- */
  .cat-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:18px;
  }
  .cat-card{
    background:var(--surface);border-radius:var(--radius-lg);
    padding:26px 22px;box-shadow:var(--shadow);
    text-align:right;transition:.2s;border:1.5px solid transparent;
    display:flex;flex-direction:column;gap:14px;
  }
  .cat-card:hover{transform:translateY(-3px);border-color:var(--primary-light);}
  .cat-icon{
    width:48px;height:48px;border-radius:16px;background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;font-size:22px;
    align-self:flex-end;
  }
  .cat-name{font-size:17px;color:var(--primary-dark);}
  .cat-count{color:var(--text-muted);font-size:13px;}

  /* ---------- "show all" button + collapsible category groups ---------- */
  .show-all-btn{
    display:flex;align-items:center;gap:8px;justify-content:center;
    width:100%;background:var(--surface);border:1.5px solid var(--line);
    border-radius:var(--radius-md);padding:14px 18px;margin-bottom:18px;
    font-weight:700;font-size:14px;color:var(--primary-dark);box-shadow:var(--shadow);transition:.15s;
  }
  .show-all-btn:hover{border-color:var(--primary-light);background:var(--accent-soft);}
  .show-all-btn svg{width:17px;height:17px;flex-shrink:0;}
  .category-group{
    background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow);
    overflow:hidden;margin-bottom:12px;
  }
  .category-group-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;cursor:pointer;
  }
  .category-group-title{
    font-weight:700;font-size:15px;color:var(--primary-dark);
    display:flex;align-items:center;gap:10px;
  }
  .category-group-count{font-weight:600;font-size:12.5px;color:var(--text-muted);}
  .category-group-body{
    padding:14px 16px 18px;border-top:1.5px solid var(--line);
    display:flex;flex-direction:column;gap:10px;
  }

  /* small, quiet utility buttons — used for "add category" / "add field" so they don't compete for attention */
  .sm-add-btn{
    width:30px;height:30px;border-radius:10px;background:#FBFAF6;border:1.3px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--text-muted);flex-shrink:0;transition:.15s;
  }
  .sm-add-btn svg{width:14px;height:14px;}
  .sm-add-btn:hover{border-color:var(--primary-light);color:var(--primary);background:#fff;}

  .page-head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 26px;}
  .page-head-row .page-head{margin:0;}

  .closed-tile{
    display:inline-flex;align-items:center;gap:10px;
    background:transparent;border:1.3px dashed var(--line);
    border-radius:var(--radius-md);padding:10px 16px;margin-top:18px;
    color:var(--text-muted);font-size:13.5px;transition:.15s;
  }
  .closed-tile:hover{border-color:var(--primary-light);color:var(--primary);}
  .closed-tile .closed-emoji{display:flex;}
  .closed-tile .closed-emoji svg{width:16px;height:16px;}
  .closed-tile b{color:var(--primary-dark);font-weight:700;}
  .tiles-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;}
  .tiles-row .closed-tile{margin-top:0;}

  /* ---------- REMINDER BANNER ---------- */
  .reminder-banner{
    background:linear-gradient(135deg,var(--accent),var(--accent-soft));
    border-radius:var(--radius-md);padding:16px 20px;margin-bottom:22px;
    box-shadow:var(--shadow);
  }
  .reminder-banner-head{
    display:flex;align-items:center;gap:8px;font-family:'Cairo',sans-serif;
    font-weight:800;font-size:15px;color:var(--primary-dark);margin-bottom:10px;
  }
  .reminder-banner-icon{display:flex;color:var(--primary-dark);}
  .reminder-banner-icon svg{width:19px;height:19px;}
  .reminder-list{display:flex;flex-wrap:wrap;gap:10px;}
  .reminder-item{
    background:rgba(255,255,255,0.65);padding:8px 14px;border-radius:12px;
    display:flex;flex-direction:column;align-items:flex-end;gap:2px;transition:.15s;text-align:right;
  }
  .reminder-item:hover{background:#fff;}
  .reminder-name{font-weight:700;font-size:13.5px;color:var(--text);}
  .reminder-time{font-size:12px;color:var(--text-muted);}

  /* ---------- APPOINTMENT CARD ---------- */
  .appt-display{
    background:#FBFAF6;border:1.5px solid var(--line);border-radius:var(--radius-md);
    padding:14px 16px;text-align:right;
  }
  .appt-date{font-weight:700;font-size:14.5px;color:var(--text);margin-bottom:4px;}
  .appt-time{font-size:13px;color:var(--text-muted);}

  /* outcome (end case) buttons in patient row */
  .outcome-icons{display:flex;align-items:center;gap:6px;}
  .outcome-divider{width:1px;height:22px;background:var(--line);margin:0 4px;}
  .outcome-btn{
    width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    color:var(--text-muted);background:transparent;transition:.15s;opacity:.55;
  }
  .outcome-btn svg{width:15px;height:15px;}
  .patient-row:hover .outcome-btn{opacity:1;}
  .outcome-btn.ok:hover{background:#E7F6E9;color:#1E9E4A;}
  .outcome-btn.no:hover{background:#fbeae6;color:var(--danger);}

  /* status badges for closed cases */
  .status-badge{
    display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:700;
  }
  .status-badge.success{background:#E7F6E9;color:#1E9E4A;}
  .status-badge.fail{background:#fbeae6;color:var(--danger);}
  .closed-note{
    margin-top:8px;font-size:13px;color:var(--text-muted);background:#FBFAF6;
    border-radius:10px;padding:8px 12px;line-height:1.7;
  }
  .closed-note b{color:var(--text);}

  /* ---------- PATIENT LIST ---------- */
  .list-toolbar{display:flex;justify-content:flex-end;margin-bottom:16px;}
  .btn-accent{
    background:var(--primary);color:#fff;padding:11px 20px;border-radius:var(--radius-sm);
    font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;
  }
  .btn-accent:hover{background:var(--primary-dark);}
  .patient-list{display:flex;flex-direction:column;gap:12px;}
  .patient-row{
    background:var(--surface);border-radius:var(--radius-md);
    padding:16px 20px;box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    cursor:pointer;transition:.15s;
  }
  .patient-row:hover{border-color:var(--primary-light);transform:translateY(-2px);}
  .patient-info{display:flex;align-items:center;gap:14px;text-align:right;}
  .avatar{
    width:44px;height:44px;border-radius:14px;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;
  }
  .patient-name{font-weight:700;font-size:15px;color:var(--text);}
  .patient-phone{font-size:13px;color:var(--text-muted);margin-top:2px;direction:ltr;text-align:right;}
  .contact-icons{display:flex;gap:8px;}
  .contact-icons a, .contact-icons button{
    width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  }
  .whatsapp-btn{background:#E7F6E9;color:#1E9E4A;}
  .whatsapp-btn:hover{background:#d3f0d6;}
  .call-btn{background:var(--accent-soft);color:var(--accent);}
  .call-btn:hover{background:#eecd9f;}
  .contact-icons svg{width:18px;height:18px;}
  .empty-state{
    text-align:center;padding:60px 20px;color:var(--text-muted);
  }
  .empty-state .em-icon{font-size:34px;margin-bottom:10px;}

  /* ---------- EXPANDABLE PATIENT CARD (open/fold a full file in place) ---------- */
  .patient-card{
    background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow);
    overflow:hidden;transition:box-shadow .15s;
  }
  .patient-card.is-expanded{box-shadow:0 18px 36px -18px rgba(31,67,63,0.4);}
  .patient-card .patient-row{
    background:transparent;box-shadow:none;border-radius:0;
  }
  .patient-card .patient-row:hover{transform:none;}
  .row-chevron{
    width:22px;height:22px;display:flex;align-items:center;justify-content:center;
    color:var(--text-muted);flex-shrink:0;
  }
  .row-chevron svg{width:15px;height:15px;transition:transform .2s;}
  .row-chevron.is-open svg{transform:rotate(180deg);}
  .patient-card-body{
    padding:16px 20px 20px;border-top:1.5px solid var(--line);
    display:flex;flex-direction:column;gap:14px;
  }
  .expanded-block{
    background:#FBFAF6;border:1.5px solid var(--line);border-radius:var(--radius-md);
    padding:14px 16px;
  }
  .expanded-status{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  .chip-btn{
    display:inline-flex;align-items:center;gap:6px;background:#fff;
    border:1.3px solid var(--line);border-radius:999px;padding:8px 14px;
    font-size:13px;font-weight:700;color:var(--primary-dark);transition:.15s;
  }
  .chip-btn:hover{border-color:var(--primary-light);background:var(--accent-soft);}

  /* ---------- PATIENT DETAIL ---------- */
  .detail-card{
    background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);
    padding:30px;margin-bottom:20px;
  }
  .detail-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .detail-id{display:flex;align-items:center;gap:16px;text-align:right;}
  .avatar-lg{
    width:60px;height:60px;border-radius:18px;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;
  }
  .detail-id h2{margin:0;font-size:20px;color:var(--primary-dark);}
  .detail-id .phone-line{color:var(--text-muted);font-size:14px;margin-top:3px;direction:ltr;text-align:right;}
  .detail-contact{display:flex;gap:10px;}
  .detail-contact a,.detail-contact button{
    padding:10px 16px;border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;
  }

  .section-title{
    font-family:'Cairo',sans-serif;font-size:15px;color:var(--primary-dark);
    margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;
  }
  .fields-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .field-card{
    background:#FBFAF6;border:1.5px solid var(--line);border-radius:var(--radius-md);
    padding:14px 16px;text-align:right;position:relative;
  }
  .field-label-display{font-size:12px;color:var(--text-muted);margin-bottom:6px;}
  .field-value-display{font-size:14.5px;color:var(--text);word-break:break-word;white-space:pre-wrap;}
  .field-del{
    position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:8px;
    color:var(--text-muted);opacity:0;transition:.15s;
  }
  .field-card:hover .field-del{opacity:1;}
  .field-del:hover{color:var(--danger);background:#fbeae6;}
  .field-del svg{width:13px;height:13px;}
  .section-title-actions{display:flex;align-items:center;gap:8px;}
  .no-fields-hint{color:var(--text-muted);font-size:13px;padding:6px 2px;}

  /* ---------- MODALS ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(31,42,40,0.45);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal{
    background:var(--surface);border-radius:var(--radius-lg);padding:28px;
    width:100%;max-width:420px;box-shadow:0 30px 60px -20px rgba(0,0,0,0.4);
    max-height:85vh;overflow-y:auto;
  }
  .modal h3{margin:0 0 18px;font-size:18px;color:var(--primary-dark);}
  .search-input{
    width:100%;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);

  }
  .search-results{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto;margin-bottom:8px;}
  .search-result-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 14px;border-radius:10px;background:#FBFAF6;cursor:pointer;transition:.15s;

  .search-result-name{font-weight:700;font-size:14px;color:var(--text);}
  .search-result-meta{font-size:12px;color:var(--text-muted);}

  .settings-row button:hover{color:var(--danger);background:#fbeae6;}
  .settings-row button svg{width:14px;height:14px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--primary-dark);color:#fff;padding:12px 22px;border-radius:var(--radius-sm);
    font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:80;opacity:0;transition:.25s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .hidden{display:none !important;}

  /* ---------- CLOSED CASES TABLE ---------- */
  .closed-table-wrap{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;}
  table.closed-table{width:100%;border-collapse:collapse;}
  .closed-table th,.closed-table td{padding:14px 18px;text-align:right;font-size:14px;border-bottom:1px solid var(--line);}
  .closed-table th{color:var(--text-muted);font-weight:700;font-size:12.5px;background:#FBFAF6;}
  .closed-table tr:last-child td{border-bottom:none;}
  .closed-table tr{cursor:pointer;}
  .closed-table tr:hover td{background:#FBFAF6;}

  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block;position:absolute;top:0;right:0;left:0;padding:24px;}
    #printArea h2{font-family:'Cairo',sans-serif;color:#1F433F;margin-bottom:4px;}

    .closed-table-wrap{overflow-x:auto;}
    table.closed-table{min-width:520px;}
    .page-back{font-size:13.5px;padding:10px 16px;}
    .reminder-banner{padding:14px 16px;}
    .reminder-item{padding:8px 12px;}
  }

const DEFAULT_DATA = {
  categories: [
    { id: 'c1', name: 'زواج', icon: '💍' },
    { id: 'c2', name: 'أطفال', icon: '🧸' },
    { id: 'c3', name: 'شخصية', icon: '🌿' },

  ],
  patients: []
};

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

/* ============ DATABASE (Supabase) ============
   categories/patients live in real Postgres tables shared by every
   device the doctor and staff log into — see sql/schema.sql. */
async function loadData(){
  try{
    const [{data:cats,error:catErr}, {data:pats,error:patErr}] =
      await Promise.all([
        sb.from('categories').select('*').order('created_at'),
        sb.from('patients').select('*').order('created_at')
      ]);
    if(catErr) throw catErr;
    if(patErr) throw patErr;

    let categories = cats || [];
    if(categories.length===0){
      const seeds = DEFAULT_DATA.categories;
      const { error: seedErr } = await sb.from('categories').insert(seeds);
      if(!seedErr) categories = seeds;
    }

    state.data = {
      categories,
      patients: (pats||[]).map(p=>({
        id: p.id,
        categoryId: p.category_id,
        name: p.name,
        phone: p.phone,
        status: p.status,
        outcome: p.outcome,
        closeNote: p.close_note,
        appointment: p.appointment,
        customFields: p.custom_fields || [],
        visitLog: p.visit_log || []
      }))
    };
  }catch(e){
    showToast('تعذر تحميل البيانات — تحقق من الاتصال بالإنترنت');
    state.data = { categories: [], patients: [] };
  }
}
async function saveData(){
  try{
    if(state.data.categories.length){
      const { error } = await sb.from('categories').upsert(
        state.data.categories.map(c=>({ id:c.id, name:c.name, icon:c.icon }))
      );
      if(error) throw error;
    }
    if(state.data.patients.length){
      const { error } = await sb.from('patients').upsert(
        state.data.patients.map(p=>({
          id: p.id,
          category_id: p.categoryId,
          name: p.name,
          phone: p.phone,
          status: p.status,
          outcome: p.outcome,
          close_note: p.closeNote,
          appointment: p.appointment,
          custom_fields: p.customFields || [],
          visit_log: p.visitLog || [],
          updated_at: new Date().toISOString()
        }))
      );
      if(error) throw error;
    }
  }catch(e){ showToast('تعذر حفظ البيانات، حاول مجددًا'); }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============ RENDER ROOT ============ */
async function render(){
  const app = document.getElementById('app');
  if(state.loading){
    app.innerHTML = `<div class="login-screen"><p style="color:var(--text-muted)">جارِ التحميل...</p></div>`;
    return;
  }
  if(state.view==='login'){ app.innerHTML = renderLogin(); attachLoginEvents(); return; }
  if(state.view==='set-password'){ app.innerHTML = renderSetPassword(); attachSetPasswordEvents(); return; }
  if(state.view==='dashboard'){ app.innerHTML = renderShell(renderDashboard()); attachDashboardEvents(); }
  else if(state.view==='list'){ app.innerHTML = renderShell(renderList()); attachListEvents(); }
  else if(state.view==='all'){ app.innerHTML = renderShell(renderAllView()); attachAllViewEvents(); }
  else if(state.view==='closed'){ app.innerHTML = renderShell(renderClosed()); attachClosedEvents(); }
  else if(state.view==='inactive'){ app.innerHTML = renderShell(renderInactive()); attachInactiveEvents(); }
  else if(state.view==='appointments'){ app.innerHTML = renderShell(renderAppointmentsView()); attachAppointmentsEvents(); }
  else if(state.view==='visitslog'){ app.innerHTML = renderShell(renderVisitsLogView()); attachVisitsLogEvents(); }
}

/* ============ DATE HELPERS ============ */
function toLocalDateStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function getTomorrowDateStr(){
  const d = new Date(); d.setDate(d.getDate()+1);
  return toLocalDateStr(d);
}
function formatApptDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('ar-SA', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}

/* ---- forced password setup on first login ---- */
function renderSetPassword(){
  return `
  <div class="login-screen">
    <div class="login-card">

      <h1>تعيين كلمة مرور جديدة</h1>

      <form id="setPassForm">
        <div class="field">
          <label>كلمة المرور الجديدة</label>
          <input type="password" id="newPass1" placeholder="٦ أحرف على الأقل" required minlength="6" autocomplete="new-password" />
        </div>
        <div class="field">
          <label>تأكيد كلمة المرور</label>
          <input type="password" id="newPass2" placeholder="أعد كتابة كلمة المرور" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn-primary">حفظ والدخول</button>
      </form>
    </div>
  </div>`;
}
function attachSetPasswordEvents(){
  document.getElementById('setPassForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const p1 = document.getElementById('newPass1').value;
    const p2 = document.getElementById('newPass2').value;
    if(p1.length<6){ showToast('كلمة المرور يجب أن تكون ٦ أحرف على الأقل'); return; }
    if(p1!==p2){ showToast('كلمتا المرور غير متطابقتين'); return; }
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'جارِ الحفظ...';
    const { error: passErr } = await sb.auth.updateUser({ password: p1 });
    if(passErr){ showToast('تعذر تحديث كلمة المرور'); btn.disabled=false; btn.textContent='حفظ والدخول'; return; }
    const { error: profErr } = await sb.from('profiles').update({ must_change_password:false }).eq('id', state.profile.id);
    if(profErr){ showToast('تعذر إكمال الإعداد'); btn.disabled=false; btn.textContent='حفظ والدخول'; return; }
    state.profile.must_change_password = false;
    await loadData();
    state.view = 'dashboard';
    render();
    showToast('تم تعيين كلمة المرور بنجاح، أهلًا بك');
  });
}

/* ---- called after sign-in AND on page load if a session already exists ---- */
async function afterAuthChange(){
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  if(!session){ state.profile = null; state.view = 'login'; render(); return; }

  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if(error || !profile){
    // no profile row for this auth user — misconfigured account, sign out to avoid a broken state
    await sb.auth.signOut();
    state.session = null; state.profile = null; state.view = 'login';
    render();
    showToast('هذا الحساب غير مُهيّأ بشكل صحيح، تواصل مع الدكتور المسؤول');
    return;
  }
  state.profile = profile;

  if(profile.must_change_password){
    state.view = 'set-password';
    render();
    return;
  }
  await loadData();
  state.view = 'dashboard';
  render();
}

/* ============ SHARED: EXPANDABLE PATIENT CARD ============
   Used by the active list, closed cases, and inactive patients — each patient's
   full file opens/folds in place, so the doctor never has to leave the list. */
function renderPatientCard(p){
  const cat = state.data.categories.find(c=>c.id===p.categoryId);
  const initial = (p.name||'؟').trim().charAt(0);
  const waNumber = (p.phone||'').replace(/[^0-9+]/g,'');
  const isClosed = p.status==='closed';
  const isInactive = p.status==='inactive';
  const isExpanded = state.expandedPatientId===p.id;
  const subLabel = (isClosed||isInactive)
    ? `${cat? cat.icon+' '+escapeHtml(cat.name):''}${p.phone? ' · '+escapeHtml(p.phone):''}`
    : escapeHtml(p.phone||'—');

  const header = `
    <div class="patient-row" data-id="${p.id}">
      <div class="patient-info">
        <div class="avatar" ${isInactive?'style="background:var(--text-muted);"':''}>${initial}</div>
        <div>
          <div class="patient-name">${escapeHtml(p.name)}</div>
          <div class="patient-phone">${subLabel}</div>
        </div>
      </div>
      <div class="contact-icons">
        <a href="https://wa.me/${encodeURIComponent(waNumber)}" target="_blank" class="whatsapp-btn" onclick="event.stopPropagation()" title="واتساب">${ICONS.whatsapp}</a>
        <a href="tel:${encodeURIComponent(p.phone||'')}" class="call-btn" onclick="event.stopPropagation()" title="اتصال">${ICONS.call}</a>
        ${p.status==='active' ? `
        <span class="outcome-divider"></span>
        <button class="outcome-btn ok" data-endcase-id="${p.id}" title="إنهاء الحالة">${ICONS.check}</button>` : ''}
        <span class="row-chevron ${isExpanded?'is-open':''}">${ICONS.chevronDown}</span>
      </div>
    </div>`;

  const body = isExpanded ? renderPatientExpandedBody(p) : '';
  return `<div class="patient-card ${isExpanded?'is-expanded':''}">${header}${body}</div>`;
}

function renderPatientExpandedBody(p){
  const isClosed = p.status==='closed';
  const isInactive = p.status==='inactive';
  const fields = (p.customFields||[]).map(f=>`
    <div class="field-card" data-fid="${f.id}">
      <button class="field-del" data-fid="${f.id}" title="حذف الحقل">${ICONS.trash}</button>
      <div class="field-label-display">${escapeHtml(f.label)}</div>
      <div class="field-value-display">${escapeHtml(f.value)||'—'}</div>
    </div>
  `).join('');

  let statusBlock;
  if(isClosed){
    const badge = p.outcome==='success'
      ? `<span class="status-badge success">${ICONS.check} حالة ناجحة</span>`
      : p.outcome==='fail'
        ? `<span class="status-badge fail">${ICONS.x} لم تنجح بشكل تام</span>`
        : `<span class="status-badge" style="background:#EDEAE0;color:var(--text-muted);">${ICONS.check} الحالة منتهية</span>`;
    statusBlock = `
      <div class="expanded-status">
        ${badge}
        <button class="chip-btn" id="reopenCase">↺ إعادة فتح الحالة</button>
      </div>
      ${p.outcome==='fail' && p.closeNote ? `<div class="closed-note"><b>ملاحظات الإغلاق: </b>${escapeHtml(p.closeNote)}</div>` : ''}`;
  } else if(isInactive){
    statusBlock = `
      <div class="expanded-status">
        <span class="status-badge" style="background:#EDEAE0;color:var(--text-muted);">${ICONS.userX} غير نشيط</span>
        <button class="chip-btn" id="reactivateCase">↺ إعادة تنشيط الملف</button>
      </div>`;
  } else {
    statusBlock = `
      <div class="expanded-status">
        <button class="chip-btn" id="detailInactive">${ICONS.userX} نقل إلى غير نشيطين</button>
      </div>`;
  }

  let apptBody;
  if(p.appointment && p.appointment.date){
    apptBody = `
      <div class="appt-display">
        <div class="appt-date">${formatApptDate(p.appointment.date)}</div>
        <div class="appt-time">الساعة ${p.appointment.hour}:${p.appointment.minute} ${p.appointment.period==='ص'?'صباحًا':'مساءً'}</div>
      </div>`;
  } else {
    apptBody = `<div class="no-fields-hint">لا يوجد موعد محدد بعد.</div>`;
  }
  const apptCard = isClosed ? '' : `
    <div class="expanded-block">
      <div class="section-title">
        <span>${ICONS.calendar} الموعد القادم</span>
        <button class="sm-add-btn" id="setApptBtn" title="${p.appointment?'تعديل الموعد':'تحديد موعد'}">${ICONS.plus}</button>
      </div>
      ${apptBody}
    </div>`;

  return `
    <div class="patient-card-body">
      ${statusBlock}
      ${apptCard}
      <div class="expanded-block">
        <div class="section-title">
          <span>تفاصيل وملاحظات إضافية</span>
          <button class="sm-add-btn" id="addFieldBtn" title="إضافة خانة جديدة">${ICONS.plus}</button>
        </div>
        <div class="fields-grid">${fields}</div>
        ${fields? '' : `<div class="no-fields-hint">لا توجد خانات إضافية بعد.</div>`}
      </div>
    </div>`;
}

/* attaches: row click to open/fold, quick outcome buttons, and — only for the
   one currently-expanded card — its inner controls */
function attachPatientCardEvents(){
  document.querySelectorAll('.patient-card .patient-row').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.id;
      state.expandedPatientId = (state.expandedPatientId===id) ? null : id;
      render();
    });
  });
  document.querySelectorAll('.outcome-btn[data-endcase-id]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      openEndCaseModal(btn.dataset.endcaseId);
    });
  });

  const id = state.expandedPatientId;
  if(!id) return;
  const p = state.data.patients.find(x=>x.id===id);
  if(!p) return;

  const apptBtn = document.getElementById('setApptBtn');
  if(apptBtn) apptBtn.addEventListener('click', (e)=>{ e.stopPropagation(); openAppointmentModal(p.id); });

  const addFieldBtn = document.getElementById('addFieldBtn');
  if(addFieldBtn) addFieldBtn.addEventListener('click', (e)=>{ e.stopPropagation(); openAddFieldModal(p.id); });

  document.querySelectorAll('.field-del').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      p.customFields = (p.customFields||[]).filter(f=>f.id!==btn.dataset.fid);
      await saveData();
      render();
    });
  });

  const reopenBtn = document.getElementById('reopenCase');
  if(reopenBtn) reopenBtn.addEventListener('click', async (e)=>{
    e.stopPropagation();
    p.status='active'; p.outcome=null; p.closeNote='';
    await saveData();
    showToast('تمت إعادة فتح الحالة');
    render();
  });

  const reactivateBtn = document.getElementById('reactivateCase');
  if(reactivateBtn) reactivateBtn.addEventListener('click', async (e)=>{
    e.stopPropagation();
    p.status='active';
    await saveData();
    showToast('تمت إعادة تنشيط الملف');
    render();
  });

  const inactiveBtn = document.getElementById('detailInactive');
  if(inactiveBtn) inactiveBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    openInactiveModal(p.id);
  });
}

/* ============ APPOINTMENTS / VISITS TABLE ============
   Quick task list of upcoming appointments — mark attendance with one tap,
   or click the row to open the full patient file. */
function renderAppointmentsView(){
  const list = state.data.patients
    .filter(p=>p.status==='active' && p.appointment && p.appointment.date)
    .slice()
    .sort((a,b)=>{
      const key = x => x.appointment.date + String(x.appointment.hour).padStart(2,'0') + String(x.appointment.minute).padStart(2,'0') + (x.appointment.period==='ص'?'0':'1');
      return key(a).localeCompare(key(b));
    });

  const rows = list.map(p=>{
    const cat = state.data.categories.find(c=>c.id===p.categoryId);
    const initial = (p.name||'؟').trim().charAt(0);
    const waNumber = (p.phone||'').replace(/[^0-9+]/g,'');
    return `
    <div class="patient-row appt-row" data-pid="${p.id}">
      <div class="patient-info">
        <div class="avatar">${initial}</div>
        <div>
          <div class="patient-name">${escapeHtml(p.name)}</div>
          <div class="patient-phone">${cat? cat.icon+' '+escapeHtml(cat.name)+' — ':''}${formatApptDate(p.appointment.date)} · ${p.appointment.hour}:${p.appointment.minute} ${p.appointment.period==='ص'?'صباحًا':'مساءً'}</div>
        </div>
      </div>
      <div class="contact-icons">
        <a href="https://wa.me/${encodeURIComponent(waNumber)}" target="_blank" class="whatsapp-btn" onclick="event.stopPropagation()" title="واتساب">${ICONS.whatsapp}</a>
        <a href="tel:${encodeURIComponent(p.phone||'')}" class="call-btn" onclick="event.stopPropagation()" title="اتصال">${ICONS.call}</a>
        <span class="outcome-divider"></span>
        <button class="appt-attend-btn" data-pid="${p.id}" title="تم الحضور — إنهاء الموعد">${ICONS.check}</button>
      </div>
    </div>`;
  }).join('');

  const empty = `<div class="empty-state"><div class="em-icon">📅</div><p>لا توجد مواعيد قادمة مسجّلة حاليًا.</p></div>`;

  return `
    <button class="page-back" id="backToDashFromAppts">${ICONS.back} العودة للتصنيفات</button>
    <div class="page-head">
      <h2>${ICONS.bell} جدول المواعيد</h2>
      <p>${list.length} ${list.length===1?'موعد قادم':'مواعيد قادمة'} — اضغط ✓ عند حضور المراجع لإنهاء الموعد، أو اضغط على الاسم لفتح ملفه</p>
    </div>
    <div class="patient-list">${list.length? rows : empty}</div>
  `;
}
function attachAppointmentsEvents(){
  attachShellEvents();
  document.getElementById('backToDashFromAppts').addEventListener('click', ()=>{ state.view='dashboard'; render(); });
  document.querySelectorAll('.appt-attend-btn').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const p = state.data.patients.find(x=>x.id===btn.dataset.pid);
      if(!p || !p.appointment) return;
      p.visitLog = p.visitLog || [];
      p.visitLog.push({
        id: uid('v'),
        date: p.appointment.date,
        hour: p.appointment.hour,
        minute: p.appointment.minute,
        period: p.appointment.period,
        categoryId: p.categoryId
      });
      p.appointment = null;
      await saveData();
      showToast('تم تسجيل الحضور وإضافة الزيارة للسجل');
      render();
    });
  });
  document.querySelectorAll('.appt-row').forEach(el=>{
    el.addEventListener('click', ()=>{
      const p = state.data.patients.find(x=>x.id===el.dataset.pid);
      if(!p) return;
      state.view='list'; state.activeCategory=p.categoryId; state.expandedPatientId=p.id;
      render();
    });
  });
}

/* ============ VISITS LOG (سجل جميع المواعيد — permanent history, separate from closed cases) ============ */
function renderVisitsLogView(){
  const rows = [];
  state.data.patients.forEach(p=>{
    (p.visitLog||[]).forEach(v=>{
      const cat = state.data.categories.find(c=>c.id===v.categoryId);
      rows.push({ patientName:p.name, categoryName: cat? cat.name : '—', categoryIcon: cat? cat.icon : '', ...v });
    });
  });
  rows.sort((a,b)=>{
    const key = x => x.date + String(x.hour).padStart(2,'0') + String(x.minute).padStart(2,'0') + (x.period==='ص'?'0':'1');
    return key(b).localeCompare(key(a)); // الأحدث أولًا
  });

  const trs = rows.map(v=>`
    <tr>
      <td>${escapeHtml(v.patientName)}</td>
      <td>${v.categoryIcon? v.categoryIcon+' ':''}${escapeHtml(v.categoryName)}</td>
      <td>${formatApptDate(v.date)} · ${v.hour}:${v.minute} ${v.period==='ص'?'صباحًا':'مساءً'}</td>
      <td><span class="status-badge" style="background:#EDEAE0;color:var(--text-muted);">منتهي</span></td>
    </tr>`).join('');

  const empty = `<div class="empty-state"><div class="em-icon">🗓️</div><p>لا توجد زيارات مسجّلة بعد — تُضاف الزيارة هنا تلقائيًا عند تسجيل الحضور من «جدول المواعيد».</p></div>`;

  return `
    <button class="page-back" id="backToDashFromVisitsLog">${ICONS.back} العودة للتصنيفات</button>
    <div class="page-head-row">
      <div class="page-head">
        <h2>سجل جميع المواعيد</h2>
        <p>${rows.length} ${rows.length===1?'زيارة مسجّلة':'زيارة مسجّلة'} — سجل دائم لكل المواعيد التي تمت، منفصل عن «حالات انتهت»</p>
      </div>
      ${rows.length? `<button class="btn-accent" id="printVisitsLogBtn">${ICONS.printer} طباعة PDF</button>` : ''}
    </div>
    ${rows.length? `
    <div class="closed-table-wrap">
      <table class="closed-table">
        <thead><tr><th>اسم المراجع</th><th>التصنيف</th><th>تاريخ الزيارة</th><th>الحالة</th></tr></thead>
        <tbody>${trs}</tbody>
      </table>
    </div>` : empty}
  `;
}
function attachVisitsLogEvents(){
  attachShellEvents();
  document.getElementById('backToDashFromVisitsLog').addEventListener('click', ()=>{ state.view='dashboard'; render(); });
  const printBtn = document.getElementById('printVisitsLogBtn');
  if(printBtn) printBtn.addEventListener('click', printVisitsLog);
}
function printVisitsLog(){
  const rows = [];
  state.data.patients.forEach(p=>{
    (p.visitLog||[]).forEach(v=>{
      const cat = state.data.categories.find(c=>c.id===v.categoryId);
      rows.push({ patientName:p.name, categoryName: cat? cat.name : '—', ...v });
    });
  });
  rows.sort((a,b)=>{
    const key = x => x.date + String(x.hour).padStart(2,'0') + String(x.minute).padStart(2,'0') + (x.period==='ص'?'0':'1');
    return key(b).localeCompare(key(a));
  });
  const dateStr = new Date().toLocaleDateString('ar-SA');
  const trs = rows.map(v=>`
    <tr>
      <td>${escapeHtml(v.patientName)}</td>
      <td>${escapeHtml(v.categoryName)}</td>
      <td>${formatApptDate(v.date)} — ${v.hour}:${v.minute} ${v.period==='ص'?'صباحًا':'مساءً'}</td>
      <td>منتهي</td>
    </tr>`).join('');

    <table>
      <thead><tr><th>اسم المراجع</th><th>التصنيف</th><th>تاريخ الزيارة</th><th>الحالة</th></tr></thead>

/* ---- appointment modal ---- */
function openAppointmentModal(patientId){
  const p = state.data.patients.find(x=>x.id===patientId);
  if(!p) return;
  const appt = p.appointment || {};
  const hourOptions = Array.from({length:12},(_,i)=>i+1)
    .map(h=>`<option value="${h}" ${String(appt.hour)===String(h)?'selected':''}>${h}</option>`).join('');
  const minuteOptions = ['00','15','30','45']
    .map(m=>`<option value="${m}" ${appt.minute===m?'selected':''}>${m}</option>`).join('');
  const selStyle = 'flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:#FBFAF7;font-size:14.5px;';
  openModal(`
    <div class="modal">
      <h3>${p.appointment? 'تعديل الموعد':'تحديد الموعد القادم'}</h3>
      <div class="field">
        <label>تاريخ الموعد</label>
        <input type="date" id="apptDate" value="${appt.date||''}" />
      </div>
      <div class="field">
        <label>الوقت</label>
        <div style="display:flex;gap:8px;">
          <select id="apptHour" style="${selStyle}">${hourOptions}</select>
          <select id="apptMinute" style="${selStyle}">${minuteOptions}</select>
          <select id="apptPeriod" style="${selStyle}">
            <option value="ص" ${appt.period==='ص'?'selected':''}>صباحًا</option>
            <option value="م" ${(!appt.period||appt.period==='م')?'selected':''}>مساءً</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        ${p.appointment? `<button class="btn-secondary" id="clearAppt">إلغاء الموعد</button>` : ''}
        <button class="btn-primary" id="saveAppt">حفظ الموعد</button>
      </div>
    </div>
  `);
  const clearBtn = document.getElementById('clearAppt');
  if(clearBtn) clearBtn.addEventListener('click', async ()=>{
    p.appointment = null;
    await saveData();
    closeModal();
    render();
    showToast('تم إلغاء الموعد');
  });
  document.getElementById('saveAppt').addEventListener('click', async ()=>{
    const date = document.getElementById('apptDate').value;
    if(!date){ showToast('الرجاء اختيار تاريخ الموعد'); return; }
    const hour = document.getElementById('apptHour').value;
    const minute = document.getElementById('apptMinute').value;
    const period = document.getElementById('apptPeriod').value;
    p.appointment = { date, hour, minute, period };
    await saveData();
    closeModal();
    render();
    showToast('تم حفظ الموعد');
  });
}

/* ============ MODALS ============ */
function openModal(html){
  document.getElementById('modalRoot').innerHTML = `<div class="overlay" id="overlayEl">${html}</div>`;
  document.getElementById('overlayEl').addEventListener('click', (e)=>{
    if(e.target.id==='overlayEl') closeModal();
  });
}
function closeModal(){
  const root = document.getElementById('modalRoot');
  if(root) root.innerHTML='';
}

/* ---- quick search: type a name, jump straight to the patient ---- */
function openSearchModal(){
  openModal(`
    <div class="modal">
      <h3>${ICONS.search} بحث عن مراجع</h3>
      <input type="text" id="searchInput" class="search-input" placeholder="اكتب الاسم أو أول الأحرف..." autocomplete="off" />
      <div id="searchResults" class="search-results"></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="closeSearch">إغلاق</button>
      </div>
    </div>
  `);
  document.getElementById('closeSearch').addEventListener('click', closeModal);
  const input = document.getElementById('searchInput');
  input.focus();
  input.addEventListener('input', ()=> renderSearchResults(input.value.trim()));
  renderSearchResults('');
}
function renderSearchResults(query){
  const box = document.getElementById('searchResults');
  if(!box) return;
  if(!query){ box.innerHTML = `<div class="no-fields-hint">ابدأ الكتابة للبحث عن مراجع بالاسم.</div>`; return; }
  const q = query.toLowerCase();
  const results = state.data.patients.filter(p=>p.name && p.name.toLowerCase().includes(q)).slice(0,30);
  if(!results.length){ box.innerHTML = `<div class="no-fields-hint">لا توجد نتائج مطابقة.</div>`; return; }
  box.innerHTML = results.map(p=>{
    const cat = state.data.categories.find(c=>c.id===p.categoryId);
    const meta = p.status==='closed' ? 'حالة منتهية' : p.status==='inactive' ? 'غير نشط' : (cat? cat.icon+' '+escapeHtml(cat.name) : '');
    return `
    <div class="search-result-row" data-pid="${p.id}">
      <span class="search-result-name">${escapeHtml(p.name)}</span>
      <span class="search-result-meta">${meta}</span>
    </div>`;
  }).join('');
  document.querySelectorAll('.search-result-row').forEach(el=>{
    el.addEventListener('click', ()=>{
      const p = state.data.patients.find(x=>x.id===el.dataset.pid);
      if(!p) return;
      closeModal();
      if(p.status==='closed'){ state.view='closed'; }
      else if(p.status==='inactive'){ state.view='inactive'; }
      else { state.view='list'; state.activeCategory=p.categoryId; }
      state.expandedPatientId = p.id;
      render();
    });
  });
}

          <input type="text" id="newCatIcon" placeholder="🗂️" maxlength="4" />

      </div>

    if(!name) return;
    const newCat = { id: uid('c'), name, icon };
    const { error } = await sb.from('categories').insert(newCat);
    if(error){ showToast('تعذر إضافة التصنيف'); return; }
    state.data.categories.push(newCat);
    renderSettingsModal(accounts);
    render();
    showToast('تمت إضافة التصنيف');
  });

  document.querySelectorAll('.editCatBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>openEditCategoryModal(btn.dataset.catid, accounts));
  });

  document.querySelectorAll('.delCatBtn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.catid;
      const hasPatients = state.data.patients.some(p=>p.categoryId===id);
      if(hasPatients){ showToast('لا يمكن حذف تصنيف يحتوي على مراجعين'); return; }
      const { error } = await sb.from('categories').delete().eq('id', id);
      if(error){ showToast('تعذر حذف التصنيف'); return; }
      state.data.categories = state.data.categories.filter(c=>c.id!==id);
      renderSettingsModal(accounts);
      render();
    });
  });

  document.getElementById('saveMyName').addEventListener('click', async ()=>{
    const name = document.getElementById('myName').value.trim();
    if(!name) return;
    const { error } = await sb.from('profiles').update({ name }).eq('id', state.profile.id);
    if(error){ showToast('تعذر حفظ الاسم'); return; }
    state.profile.name = name;
    showToast('تم تحديث الاسم');
    render();
  });

  document.getElementById('saveMyPass').addEventListener('click', async ()=>{
    const val = document.getElementById('myNewPass').value;
    if(!val) return;
    if(val.length<6){ showToast('كلمة المرور يجب أن تكون ٦ أحرف على الأقل'); return; }
    const { error } = await sb.auth.updateUser({ password: val });
    if(error){ showToast('تعذر تحديث كلمة المرور'); return; }
    document.getElementById('myNewPass').value='';
    showToast('تم تحديث كلمة المرور');
  });

  const createAccBtn = document.getElementById('createAccBtn');
  if(createAccBtn) createAccBtn.addEventListener('click', async ()=>{
    const username = document.getElementById('newAccUsername').value.trim();
    const name = document.getElementById('newAccName').value.trim();
    const tempPass = document.getElementById('newAccTempPass').value.trim();
    if(!username || !name){ showToast('الرجاء إدخال الاسم واسم المستخدم'); return; }
    if(tempPass && tempPass.length < 6){ showToast('الرمز المؤقت يجب أن يكون ٦ أحرف على الأقل'); return; }
    createAccBtn.disabled = true; createAccBtn.textContent = 'جارِ الإنشاء...';
    try{
      const { data: { session } } = await sb.auth.getSession();
      const res = await fetch('/api/create-user', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+session.access_token },
        body: JSON.stringify(tempPass ? { username, name, tempPassword: tempPass } : { username, name })
      });
      let result;
      try{ result = await res.json(); }
      catch(parseErr){
        throw new Error(res.status===404
          ? 'الخادم لم يجد /api/create-user (404) — تأكد أن ملف api/create-user.js مرفوع على GitHub بنفس المسار وأن Vercel أعاد النشر'
          : 'رد الخادم غير متوقع (كود '+res.status+') — تحقق من Vercel ← Deployments ← Functions'
        );
      }
      if(!res.ok){ showToast(result.error || 'تعذر إنشاء الحساب'); createAccBtn.disabled=false; createAccBtn.textContent='إنشاء حساب جديد'; return; }
      showTempPasswordModal(result.username, result.tempPassword, ()=>openSettingsModal());
    }catch(e){
      showToast(e.message || 'تعذر الاتصال بالخادم');
      createAccBtn.disabled=false; createAccBtn.textContent='إنشاء حساب جديد';
    }
  });

  document.querySelectorAll('.resetAccBtn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch('/api/reset-password', {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+session.access_token },
          body: JSON.stringify({ userId: btn.dataset.uid })
        });
        const result = await res.json();
        if(!res.ok){ showToast(result.error || 'تعذر إعادة تعيين كلمة المرور'); return; }
        showTempPasswordModal(btn.dataset.uname, result.tempPassword, ()=>openSettingsModal());
      }catch(e){ showToast('تعذر الاتصال بالخادم'); }
    });
  });

  document.querySelectorAll('.delAccBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const uid_ = btn.dataset.uid, uname = btn.dataset.uname;
      openModal(`
        <div class="modal">
          <h3>حذف الحساب</h3>
          <p style="color:var(--text-muted);font-size:14px;line-height:1.8;margin:0 0 6px;">
            سيتم حذف حساب <b style="color:var(--text)">${escapeHtml(uname)}</b> نهائيًا ولن يستطيع الدخول مرة أخرى.
          </p>
          <div class="modal-actions">
            <button class="btn-secondary" id="cancelDelAcc">إلغاء</button>
            <button class="btn-primary" id="confirmDelAcc">تأكيد الحذف</button>
          </div>
        </div>
      `);
      document.getElementById('cancelDelAcc').addEventListener('click', ()=>openSettingsModal());
      document.getElementById('confirmDelAcc').addEventListener('click', async ()=>{
        try{
          const { data: { session } } = await sb.auth.getSession();
          const res = await fetch('/api/delete-user', {
            method:'POST',
            headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+session.access_token },
            body: JSON.stringify({ userId: uid_ })
          });
          const result = await res.json();
          if(!res.ok){ showToast(result.error || 'تعذر حذف الحساب'); return; }
          showToast('تم حذف الحساب');
          openSettingsModal();
        }catch(e){ showToast('تعذر الاتصال بالخادم'); }
      });
    });
  });
}

function showTempPasswordModal(username, tempPassword, onClose){
  openModal(`
    <div class="modal">
      <h3>بيانات الدخول جاهزة</h3>
      <p style="color:var(--text-muted);font-size:14px;line-height:1.9;margin:0 0 10px;">
        شارك بيانات الدخول التالية مع الموظف — سيُطلب منه تعيين كلمة مرور خاصة به عند أول دخول.
      </p>
      <div class="expanded-block" style="text-align:center;">
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:4px;">اسم المستخدم</div>
        <div style="font-weight:800;font-size:17px;color:var(--primary-dark);margin-bottom:14px;">${escapeHtml(username)}</div>
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:4px;">كلمة المرور المؤقتة</div>
        <div style="font-weight:800;font-size:17px;color:var(--primary-dark);letter-spacing:1px;">${escapeHtml(tempPassword)}</div>
      </div>
      <div class="modal-actions">
        <button class="btn-primary" id="closeTempPass">تم</button>
      </div>
    </div>
  `);
  document.getElementById('closeTempPass').addEventListener('click', ()=>{
    closeModal();
    if(onClose) onClose();
  });
}

/* ---- edit category (name + emoji) ---- */
function openEditCategoryModal(catId, accounts){
  const c = state.data.categories.find(x=>x.id===catId);
  if(!c) return;
  openModal(`
    <div class="modal">
      <h3>تعديل التصنيف</h3>
      <div class="field-row-2">
        <div class="field">
          <label>اسم التصنيف</label>
          <input type="text" id="editCatName" value="${escapeHtml(c.name)}" />
        </div>
        <div class="field field-emoji">
          <label>الأيقونة</label>
          <input type="text" id="editCatIcon" value="${escapeHtml(c.icon||'🗂️')}" maxlength="4" />
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancelEditCat">إلغاء</button>
        <button class="btn-primary" id="saveEditCat">حفظ التعديل</button>
      </div>
    </div>
  `);
  document.getElementById('cancelEditCat').addEventListener('click', ()=>renderSettingsModal(accounts));
  document.getElementById('saveEditCat').addEventListener('click', async ()=>{
    const name = document.getElementById('editCatName').value.trim();
    const icon = document.getElementById('editCatIcon').value.trim() || '🗂️';
    if(!name){ showToast('الرجاء إدخال اسم التصنيف'); return; }
    const { error } = await sb.from('categories').update({ name, icon }).eq('id', catId);
    if(error){ showToast('تعذر حفظ التعديل'); return; }
    c.name = name; c.icon = icon;
    renderSettingsModal(accounts);
    render();
    showToast('تم تعديل التصنيف');
  });
}

/* ---- add patient modal ---- */
function openAddPatientModal(){
  openModal(`
    <div class="modal">
      <h3>إضافة مراجع جديد</h3>
      <div class="field">
        <label>الاسم</label>
        <input type="text" id="newPName" placeholder="اسم المراجع" />
      </div>
      <div class="field">
        <label>رقم الجوال</label>
        <input type="tel" id="newPPhone" placeholder="05xxxxxxxx" />
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancelAddP">إلغاء</button>
        <button class="btn-primary" id="saveAddP">إضافة</button>
      </div>
    </div>
  `);
  document.getElementById('cancelAddP').addEventListener('click', closeModal);
  document.getElementById('saveAddP').addEventListener('click', async ()=>{
    const name = document.getElementById('newPName').value.trim();
    const phone = document.getElementById('newPPhone').value.trim();
    if(!name){ showToast('الرجاء إدخال اسم المراجع'); return; }
    state.data.patients.push({
      id: uid('p'), categoryId: state.activeCategory, name, phone, customFields:[], visitLog:[],
      status:'active', outcome:null, closeNote:'', appointment:null
    });
    await saveData();
    closeModal();
    render();
    showToast('تمت إضافة المراجع');
  });
}

/* ---- add custom field modal ---- */
function openAddFieldModal(patientId){
  openModal(`
    <div class="modal">
      <h3>إضافة خانة جديدة</h3>
      <div class="field">
        <label>اسم الخانة</label>
        <input type="text" id="newFLabel" placeholder="مثال: تشخيص أولي" />
      </div>
      <div class="field">
        <label>المحتوى</label>
        <textarea id="newFValue" rows="3" placeholder="اكتب الملاحظات هنا" style="width:100%;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:#FBFAF7;font-size:14.5px;resize:vertical;"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancelAddF">إلغاء</button>
        <button class="btn-primary" id="saveAddF">حفظ</button>
      </div>
    </div>
  `);
  document.getElementById('cancelAddF').addEventListener('click', closeModal);
  document.getElementById('saveAddF').addEventListener('click', async ()=>{
    const label = document.getElementById('newFLabel').value.trim();
    const value = document.getElementById('newFValue').value.trim();
    if(!label){ showToast('الرجاء إدخال اسم الخانة'); return; }
    const p = state.data.patients.find(x=>x.id===patientId);
    if(!p) return;
    p.customFields = p.customFields || [];
    p.customFields.push({ id: uid('f'), label, value });
    await saveData();
    closeModal();
    render();
    showToast('تمت إضافة الخانة');
  });
}

/* ============ UTIL ============ */
function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str)
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;');
}

/* ============ INIT ============ */
(async function init(){
  render(); // shows the loading spinner immediately while we check for a session
  const { data: { session } } = await sb.auth.getSession();
  state.loading = false;
  if(session){
    await afterAuthChange();   // resolves the right view (dashboard / set-password) and renders
  } else {
    state.view = 'login';
    render();
  }
})();

/* ============ PWA: service worker (enables "install app" from the browser) ============ */
if('serviceWorker' in navigator){
  try{
    const swCode = `
      self.addEventListener('install', e=>self.skipWaiting());
      self.addEventListener('activate', e=>self.clients.claim());
      self.addEventListener('fetch', e=>{});
    `;
    const blob = new Blob([swCode], {type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  }catch(e){}
}
</script>
